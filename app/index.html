<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Đập Chuột</title>
<link rel="preload" as="image" href="../assets/mouse.png">
<link rel="preload" as="image" href="../assets/mouse-stunned.png">
<link rel="stylesheet" href="../design/tokens.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

<main id="app">

  <!-- ===== SIGNUP (docs/03 §8) ===== -->
  <section class="screen screen--panel" id="screen-signup" hidden>
    <div class="panel">
      <h1 class="display title title--signup">Đăng ký chơi</h1>
      <p class="lead">Nhập thông tin để bắt đầu</p>

      <form class="signup" id="signup-form" novalidate>
        <div class="field">
          <label class="field__label" for="signup-fullName">Họ và tên</label>
          <input class="field__input" id="signup-fullName" name="fullName" type="text"
                 autocomplete="name" aria-describedby="signup-fullName-error" required>
          <p class="field__error" id="signup-fullName-error" aria-live="polite"></p>
        </div>

        <div class="field">
          <label class="field__label" for="signup-email">Email</label>
          <input class="field__input" id="signup-email" name="email" type="email"
                 autocomplete="email" inputmode="email" aria-describedby="signup-email-error" required>
          <p class="field__error" id="signup-email-error" aria-live="polite"></p>
        </div>

        <div class="field">
          <label class="field__label" for="signup-phone">Số điện thoại</label>
          <input class="field__input" id="signup-phone" name="phone" type="tel"
                 autocomplete="tel" inputmode="tel" aria-describedby="signup-phone-error" required>
          <p class="field__error" id="signup-phone-error" aria-live="polite"></p>
        </div>

        <p class="signup__alert" id="signup-error" role="alert" hidden></p>

        <button class="btn btn--lg" id="signup-submit" type="submit" disabled>Vào chơi</button>
      </form>
    </div>
  </section>

  <!-- ===== START ===== -->
  <section class="screen screen--panel" id="screen-start">
    <div class="panel">
      <div class="panel__top">
        <p class="best" id="start-best" hidden>Kỷ lục: <strong id="start-best-value">0</strong></p>
        <button class="sound" type="button" data-sound-toggle aria-pressed="true" aria-label="Tắt âm thanh">
          <span aria-hidden="true" data-sound-icon>🔊</span>
        </button>
      </div>

      <p class="greeting" id="start-greeting" hidden>
        Chào <strong id="start-greeting-name">bạn</strong> ·
        <button class="linklike" id="btn-switch-player" type="button">Đổi người chơi</button>
      </p>

      <h1 class="display title">Đập Chuột</h1>
      <p class="lead">Đập trúng chuột được 1 điểm.<br>Bạn có 30 giây!</p>

      <button class="btn btn--lg" id="btn-start" type="button">Bắt đầu</button>
    </div>
  </section>

  <!-- ===== PLAYING ===== -->
  <section class="screen screen--play" id="screen-play" hidden>
    <div class="hud">
      <p class="hud__item" aria-live="polite">
        <span class="hud__label">Điểm</span>
        <span class="hud__value num" id="hud-score">0</span>
      </p>

      <button class="sound sound--hud" type="button" data-sound-toggle aria-pressed="true" aria-label="Tắt âm thanh">
        <span aria-hidden="true" data-sound-icon>🔊</span>
      </button>

      <p class="hud__item hud__item--right">
        <span class="hud__label">Thời gian</span>
        <span class="hud__value num" id="hud-time" aria-live="off">30</span>
      </p>
    </div>

    <div class="board" id="board" role="group" aria-label="Lưới 9 hang">
      <!-- 9 ô do game.js dựng -->
    </div>
  </section>

  <!-- ===== OVER ===== -->
  <section class="screen screen--panel" id="screen-over" hidden>
    <div class="panel">
      <h2 class="display title title--over">Hết giờ!</h2>

      <p class="final">
        <span class="final__value num display" id="over-score">0</span>
        <span class="final__label">điểm lượt này</span>
      </p>

      <p class="record" id="record" hidden>🎉 Kỷ lục mới!</p>

      <p class="best best--over">Kỷ lục: <strong id="over-best">0</strong></p>

      <button class="btn btn--lg" id="btn-replay" type="button">Chơi lại</button>
    </div>
  </section>

</main>

<script src="game.js"></script>
<script src="signup.js"></script>
</body>
</html>
